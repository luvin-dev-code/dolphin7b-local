name: Build & Publish Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Signing Keystore
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ -f "app/debug.keystore.base64" ] && [ ! -f "app/debug.keystore" ]; then
            base64 -d app/debug.keystore.base64 > app/debug.keystore
          fi

      - name: Build Signed Release & Debug APKs
        run: |
          gradle assembleRelease assembleDebug --no-daemon

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-assets
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" release-assets/Dolphine-7B-Local-release.apk
          fi
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" release-assets/Dolphine-7B-Local-debug.apk
          fi
          ls -lh release-assets/

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dolphine-7B-Local-APK
          path: release-assets/*.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0-latest' }}
          name: "Dolphine 7B Local - Android Release APK"
          body_path: README.md
          files: |
            release-assets/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
